# PRODUCCIÓN con el SITIO NUEVO: /etc/nginx/sites-available/grupokasto.com
# Se instala con:  GK_PROD=nuevo bash deploy/deploy.sh   (cuando el cliente apruebe el sitio nuevo)
# Las URLs viejas de APEX redirigen con 301 a las páginas nuevas (mapa $grupokasto_redirect en conf.d)
# y las imágenes/PDF del sitio viejo se siguen sirviendo en sus rutas originales.

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto.com www.grupokasto.com;
    return 301 https://www.grupokasto.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grupokasto.com;

    ssl_certificate /etc/letsencrypt/live/www.grupokasto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.grupokasto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.grupokasto.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.grupokasto.com;

    ssl_certificate /etc/letsencrypt/live/www.grupokasto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.grupokasto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    set $robots "all";
    include /etc/nginx/snippets/grupokasto-nuevo-site.conf;
}
