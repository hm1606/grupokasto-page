# /etc/nginx/snippets/grupokasto-nuevo-site.conf — contenido del sitio nuevo (build de Astro).
# Quien lo incluya define $robots ("noindex, nofollow" en revisión; "all" en producción).
root /var/www/grupokasto-site;
index index.html;
charset utf-8;

add_header X-Robots-Tag $robots always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# URLs viejas de APEX (f?p=102:<página>): 301 permanente a la página nueva, así Google traspasa el
# posicionamiento. Si no reconoce la página, f.html la resuelve en el navegador.
location = /ords/PDB1/f {
    if ($grupokasto_redirect) {
        return 301 $grupokasto_redirect;
    }
    add_header X-Robots-Tag "noindex" always;
    try_files /ords/PDB1/f.html =404;
}
# Archivos del sitio viejo que pueden estar enlazados desde fuera (imágenes, el PDF de sostenibilidad…):
# se siguen sirviendo desde la copia del sitio viejo.
location = /ords/PDB1/xxpokasto/r/102/files/static/v45/Modelo_de_Sostenibilidad_GK.pdf {
    return 301 /docs/modelo-de-sostenibilidad-grupo-kasto.pdf;
}
location ~ ^/ords/PDB1/xxpokasto/r/102/files/static/v\d+/(.+)$ {
    add_header Cache-Control "public, max-age=604800";
    alias /var/www/grupokasto-legacy/static/$1;
}
location ^~ /static/ {
    add_header Cache-Control "public, max-age=604800";
    root /var/www/grupokasto-legacy;
    try_files $uri =404;
}

# Formulario de contacto -> API (PM2, server/api.mjs)
location /api/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

location / {
    try_files $uri $uri/index.html $uri.html =404;
}
# Archivos con huella en el nombre: se guardan un año
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots always;
    try_files $uri =404;
}
location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots always;
    try_files $uri =404;
}
location /og/ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Robots-Tag $robots always;
    try_files $uri =404;
}
location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
}
location ~ /\.(?!well-known) {
    deny all;
}

error_page 404 /404.html;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json application/xml application/manifest+json image/svg+xml text/plain;
