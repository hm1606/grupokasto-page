# /etc/nginx/snippets/grupokasto-legacy-site.conf — cómo se sirve el sitio anterior (legacy/site, generado por legacy/build.py)
# Mismas URLs que el sitio nuevo (/nosotros/, /divisiones/granos/, /noticias/<nota>/…): al cambiar de sitio no cambia ninguna.
root /var/www/grupokasto-legacy;
index index.html;
charset utf-8;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# URLs viejas de Oracle APEX (/ords/PDB1/f?p=102:<página o alias>[:sesión[:…]]): 301 a la ruta limpia
location = /ords/PDB1/f {
    return 301 $grupokasto_legacy_path;
}
# Archivos de la aplicación APEX (#APP_IMAGES#): …/files/static/v45/<ruta> = /static/<ruta>
location ~ ^/ords/PDB1/xxpokasto/r/102/files/static/v\d+/(.+)$ {
    return 301 /static/$1;
}

# El Modelo de Sostenibilidad se consulta en la página (no se descarga): el PDF viejo lleva al visor
location = /static/Modelo_de_Sostenibilidad_GK.pdf {
    return 301 /sostenibilidad/;
}

# Formulario de contacto -> API (PM2, server/api.mjs)
location /api/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|pdf)$ {
    # Fotos optimizadas: la URL del archivo original lleva a la versión nueva
    if ($grupokasto_static_moved) {
        return 301 $grupokasto_static_moved;
    }
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/index.html $uri/ =404;
}

location ~ /\.(?!well-known) {
    deny all;
}

error_page 404 /404.html;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
