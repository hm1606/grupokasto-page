# /etc/nginx/snippets/grupokasto-legacy-site.conf — cómo se sirve el sitio viejo (clon de APEX, app 102)
root /var/www/grupokasto-legacy;
index index.html;
charset utf-8;

# /ords/PDB1/f?p=102:<número o alias>[:sesión[:…]] -> la página capturada
location = /ords/PDB1/f {
    default_type text/html;
    add_header Cache-Control "no-cache";
    try_files /_apex/$grupokasto_apex_page.html /_apex/p1.html;
}
# Los archivos de páginas solo se sirven a través de la URL original
location /_apex/ {
    internal;
}

# Archivos estáticos de la aplicación (#APP_IMAGES#): …/files/static/v45/<ruta> = /static/<ruta>
location ~ ^/ords/PDB1/xxpokasto/r/102/files/static/v\d+/(.+)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files /static/$1 =404;
}

# Llamadas de APEX que ya no tienen servidor detrás (botones de idioma):
# las AJAX responden vacío y los envíos de página regresan a la misma página.
location = /ords/PDB1/wwv_flow.ajax {
    default_type application/json;
    return 200 '{}';
}
location = /ords/PDB1/wwv_flow.accept {
    return 303 $grupokasto_back;
}

# Formulario de contacto -> API (PM2, server/api.mjs)
location /api/ {
    proxy_pass http://127.0.0.1:4012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|pdf)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ =404;
}

location ~ /\.(?!well-known) {
    deny all;
}

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;
