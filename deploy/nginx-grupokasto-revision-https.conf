# /etc/nginx/sites-available/grupokasto-revision (versión con HTTPS; deploy.sh la usa si ya existe el certificado)
#   https://grupokasto.82-180-133-158.sslip.io          sitio nuevo (noindex)
#   http://grupokasto-legacy.82-180-133-158.sslip.io    clon del sitio viejo (noindex)

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto.82-180-133-158.sslip.io;
    return 301 https://grupokasto.82-180-133-158.sslip.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grupokasto.82-180-133-158.sslip.io;

    ssl_certificate /etc/letsencrypt/live/grupokasto.82-180-133-158.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grupokasto.82-180-133-158.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set $robots "noindex, nofollow";
    include /etc/nginx/snippets/grupokasto-nuevo-site.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto-legacy.82-180-133-158.sslip.io;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/grupokasto-legacy-site.conf;
}
