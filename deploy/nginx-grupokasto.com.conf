# PRODUCCIÓN con el SITIO VIEJO (clon idéntico de Oracle APEX): /etc/nginx/sites-available/grupokasto.com
# Se instala con:  GK_PROD=legacy bash deploy/deploy.sh   (cuando el DNS de grupokasto.com apunte a este servidor
# y exista el certificado:  certbot certonly --nginx -d www.grupokasto.com -d grupokasto.com)
# Las páginas se sirven en sus URLs originales: https://www.grupokasto.com/ords/PDB1/f?p=102:<página>

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto.com www.grupokasto.com;
    return 301 https://www.grupokasto.com$request_uri;
}

# Sin www -> con www (como siempre ha sido el sitio)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grupokasto.com;

    ssl_certificate /etc/letsencrypt/live/www.grupokasto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.grupokasto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.grupokasto.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.grupokasto.com;

    ssl_certificate /etc/letsencrypt/live/www.grupokasto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.grupokasto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/grupokasto-legacy-site.conf;
}
