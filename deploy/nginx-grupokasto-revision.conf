# /etc/nginx/sites-available/grupokasto-revision
# Dominios de REVISIÓN (noindex). dev.grupokasto.com: registro A a este servidor; sslip.io resuelve *.82-180-133-158.sslip.io solo:
#   http://dev.grupokasto.com          sitio nuevo (noindex)
#   http://grupokasto-legacy.82-180-133-158.sslip.io   sitio anterior (noindex)
# Para HTTPS del sitio nuevo: certbot certonly --nginx -d dev.grupokasto.com
# y en el siguiente deploy.sh se instala deploy/nginx-grupokasto-revision-https.conf en lugar de este.

server {
    listen 80;
    listen [::]:80;
    server_name dev.grupokasto.com;
    set $robots "noindex, nofollow";
    include /etc/nginx/snippets/grupokasto-nuevo-site.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto-legacy.82-180-133-158.sslip.io;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/grupokasto-legacy-site.conf;
}
