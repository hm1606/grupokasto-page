# /etc/nginx/sites-available/grupokasto-revision
# Dominios de REVISIÓN (sin tocar el DNS de grupokasto.com; sslip.io resuelve *.82-180-133-158.sslip.io a este servidor):
#   http://grupokasto.82-180-133-158.sslip.io          sitio nuevo (noindex)
#   http://grupokasto-legacy.82-180-133-158.sslip.io   clon del sitio viejo (noindex)
# Para HTTPS del sitio nuevo: certbot certonly --nginx -d grupokasto.82-180-133-158.sslip.io
# y en el siguiente deploy.sh se instala deploy/nginx-grupokasto-revision-https.conf en lugar de este.

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto.82-180-133-158.sslip.io;
    set $robots "noindex, nofollow";
    include /etc/nginx/snippets/grupokasto-nuevo-site.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name grupokasto-legacy.82-180-133-158.sslip.io;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/grupokasto-legacy-site.conf;
}
