# /etc/nginx/conf.d/grupokasto-legacy.conf (contexto http)
# A dónde regresar tras un envío de página de APEX en el clon (botones de idioma): la página de origen.
map $http_referer $grupokasto_back {
    default "/ords/PDB1/f?p=102:1";
    "~^https?://[^/]+(?<gk_ref_path>/ords/PDB1/f\?.*)$" $gk_ref_path;
}
